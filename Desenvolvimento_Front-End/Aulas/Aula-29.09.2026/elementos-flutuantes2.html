<!DOCTYPE html>
<html lang="en">
<head>
    <title>Elementos flutuantes</title>
    <meta charset="UTF-8">

    <style type="text/css"> /* pra variar vamos aplicar internal estilos */
        .conteudo {
            background: #00ccff;
            border: 1px solid gray;
            width: 200px;
            height: 200px;
        }

        /* vamos criar uma nova classe e aplicar a um dos elementos
           com a propriedade float à direita */
        .conteudo1 {
            background: #ff0000;
            border: 1px solid gray;
            width: 200px;
            height: 200px;
            float: right; /* flutuando à direita na página*/
        }
    </style>
</head>
<body>
    <div class="conteudo1">
        Conteúdo1
    </div>
    <div class="conteudo">
        Conteúdo2
    </div>
    <div class="conteudo">
        Conteúdo3
    </div>
</body>
</html>
