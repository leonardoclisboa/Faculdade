<!DOCTYPE html>
<html lang="en">
<head>

    <title>Elementos inline, block e inline-block</title>

    <meta charset="UTF-8">

    <style type="text/css">

        .borda{
            border: 1px solid red;

            /* podemos também forçar a exibição dos elementos
               em bloco, inline ou inline-block */

            /* display: block;
            display: inline; */

            display: inline-block;
        }

    </style>

</head>

<body>

    <!--exemplo de elementos bloco que ocupam toda a página-->

    <h1 class="borda">Bloco 1</h1>
    <h1 class="borda">Bloco 2</h1>
    <div class="borda">Bloco 3</div>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis
    reiciendis magnam sequi rem illum animi hic, aperiam amet eos repellat
    deleniti, dolores vero! Dolorum vero similique ea ipsa, est dolores.</p>

    <!--exemplo de elementos inline que ficam um ao lado do outro-->

    <span class="borda">inline 1</span>
    <span class="borda">inline 2</span>

</body>
</html>
