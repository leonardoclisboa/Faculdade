<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form>
        
        Seu nome Completo: <input type="text" name="nome" placeholder="Seu nome completo"><br>
        <br>
        E-mail: <input type="email" name="email" placeholder="exemplo@dominio.com"><br>
        <br>    
        Senha: <input type="password" name="senha"><br> 
        <br>
        Idade: <input type="number" name="idade" min="0" max="120"><br>
        <br>
        Data de Nascimento: <input type="date" name="data_nascimento"><br>
        <br>
        Site pessoal: <input type="url" name="site_pessoal" placeholder=""><br>
        <br>
        Cor favorita: <input type="color" name="cor_favorita"><br>
        <br>
        Aceito os termos: <input type="checkbox" name="termos"><br>
        <br>
        Genero:
        <input type="radio" name="genero" value="masculino"> Masculino
        <input type="radio" name="genero" value="feminino"> Feminino
        <input type="radio" name="genero" value="outro"> Outro <br>
        <br>
        comentarios: <textarea name="comentarios" rows="4" cols="50" placeholder=""></textarea><br> 
        <br>
        <input type="submit" value="Enviar">

    </form> 
</body>
</html>
